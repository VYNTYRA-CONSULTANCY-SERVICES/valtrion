name: Tests & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: valtrion_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Format check with black
      run: |
        black --check app || true
    
    - name: Test with pytest
      env:
        FLASK_ENV: testing
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/valtrion_test
        SECRET_KEY: test-secret-key
        MAIL_USERNAME: test@gmail.com
        MAIL_PASSWORD: test-password
      run: |
        pytest --cov=app --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Bandit security check
      uses: gaurav-nelson/github-action-bandit@v1
      with:
        path: "app"
    
    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: app
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

  docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t valtrion:latest .
    
    - name: Test Docker image
      run: |
        docker run --rm -e SECRET_KEY=test-secret-key valtrion:latest python -c "from app import create_app; app = create_app(); print('App loaded successfully')"
