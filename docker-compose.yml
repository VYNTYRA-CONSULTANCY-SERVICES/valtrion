version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: valtrion-postgres
    environment:
      POSTGRES_DB: valtrion
      POSTGRES_USER: valtrion_user
      POSTGRES_PASSWORD: valtrion_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valtrion_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  web:
    build: .
    container_name: valtrion-web
    command: gunicorn -k eventlet -w 1 --bind 0.0.0.0:5000 wsgi:app
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://valtrion_user:valtrion_password@postgres:5432/valtrion
      SECRET_KEY: dev-secret-key-change-in-production
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
